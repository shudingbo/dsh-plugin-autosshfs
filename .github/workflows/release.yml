name: release

# One command (`git push --tags`) is the whole release: tests, npm publish with
# provenance, then a GitHub release.
#
# Publishing uses npm Trusted Publishing (OIDC): the package's npm settings list
# this repository and this workflow as a trusted publisher, so the workflow's
# OIDC identity is accepted as proof of presence. No token secret is stored and
# no interactive 2FA is needed. Configure it with:
#
#   npm trust github @shudingbo/dsh-plugin-autosshfs \
#     --file release.yml --repo shudingbo/dsh-plugin-autosshfs --allow-publish -y
#
# A fork that publishes under its own account can add a granular access token
# instead: set an NPM_TOKEN secret and add
# `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` to the publish step. Note
# that npm requires interactive 2FA for token-based publishes, so a token only
# reaches `npm stage publish` (see docs: staged publishing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
