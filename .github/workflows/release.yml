name: release

# One command (`git push --tags`) is the whole release: tests, npm publish with
# provenance, then a GitHub release.
#
# Publishing has two modes, chosen by whether the NPM_TOKEN secret exists:
#
#   1. Trusted publishing (OIDC, preferred). The package's npm settings list
#      this repository + workflow as a trusted publisher. No token is stored;
#      npm accepts the workflow's OIDC identity as proof of presence, so the
#      publish is direct and this run also creates the GitHub release.
#      Configure it with:
#        npm trust github @shudingbo/dsh-plugin-autosshfs \
#          --file release.yml --repo shudingbo/dsh-plugin-autosshfs \
#          --allow-publish -y
#      then delete the NPM_TOKEN secret.
#
#   2. Staged publishing (NPM_TOKEN present). npm no longer lets a granular
#      access token satisfy 2FA for a direct publish, so the run uploads a
#      staged release instead; a maintainer approves it with 2FA at
#      https://www.npmjs.com/ (or `npm stage approve <id>`). The GitHub
#      release is then created after that approval.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      # An unset secret reaches the step as a null env entry, and `null != ''`
      # is true in GitHub expressions, so both branches test for null as well.
      - name: Publish with trusted publishing (OIDC)
        if: env.NODE_AUTH_TOKEN == null || env.NODE_AUTH_TOKEN == ''
        run: npm publish --provenance --access public

      - name: Stage the publish for a 2FA approval
        if: env.NODE_AUTH_TOKEN != null && env.NODE_AUTH_TOKEN != ''
        run: |
          npm stage publish --provenance --access public --tag latest
          echo "::notice::Staged. Approve it with 2FA: npm stage list, then npm stage approve <id> (or the npm website)."

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && (env.NODE_AUTH_TOKEN == null || env.NODE_AUTH_TOKEN == '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
